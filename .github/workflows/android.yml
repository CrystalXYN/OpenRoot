name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  # 允许在 Actions 页面手动重跑，改完 secrets 不用再推一次空提交
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    # 临时 root 载荷（native/）需要用 NDK r27d 交叉编译成 arm64 二进制
    - name: Set up NDK
      id: setup-ndk
      uses: nttld/setup-ndk@v1
      with:
        ndk-version: r27d
        add-to-path: false

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # 1. 获取北京时间日期并设置为环境变量
    - name: Set version and date
      run: |
        DATE=$(TZ='Asia/Shanghai' date +'%Y%m%d')
        echo "DATE=$DATE" >> $GITHUB_ENV
        echo "VERSION=v$DATE" >> $GITHUB_ENV

    # 2. 构建 Release APK（未签名）
    - name: Build Release APK
      run: ./gradlew assembleRelease
      env:
        ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}

    # 3. 先确认四个签名 secret 都在。缺任何一个，apksigner 只会报
    #    "Failed to load signer signer #1"，看不出是 secret 没配。
    - name: Check signing secrets
      env:
        SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        ALIAS: ${{ secrets.ALIAS }}
        KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: |
        missing=""
        [ -n "$SIGNING_KEY" ]        || missing="$missing SIGNING_KEY"
        [ -n "$ALIAS" ]              || missing="$missing ALIAS"
        [ -n "$KEY_STORE_PASSWORD" ] || missing="$missing KEY_STORE_PASSWORD"
        [ -n "$KEY_PASSWORD" ]       || missing="$missing KEY_PASSWORD"
        if [ -n "$missing" ]; then
          echo "::error::缺少签名 secret:$missing。请在 Settings → Secrets and variables → Actions 中补齐（SIGNING_KEY 为 keystore 的 base64）。"
          exit 1
        fi
        echo "签名 secret 齐全"

    # 4. 直接用 build-tools 的 zipalign + apksigner 签名。
    #    不走第三方 action：它对空 secret 的报错没有指向性，且已被告知 Node 20 弃用。
    - name: Sign APK
      id: sign_app
      env:
        SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        ALIAS: ${{ secrets.ALIAS }}
        KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: |
        set -euo pipefail
        BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
        echo "build-tools: $BT"

        UNSIGNED=$(ls app/build/outputs/apk/release/*-unsigned.apk | head -1)
        echo "unsigned: $UNSIGNED"

        KS="$RUNNER_TEMP/signingKey.jks"
        printf '%s' "$SIGNING_KEY" | base64 -d > "$KS"
        keytool -list -keystore "$KS" -storepass "$KEY_STORE_PASSWORD" -alias "$ALIAS" > /dev/null

        "$BT/zipalign" -f -p 4 "$UNSIGNED" "$RUNNER_TEMP/aligned.apk"
        OUT="app/build/outputs/apk/release/app-release-signed.apk"
        "$BT/apksigner" sign \
          --ks "$KS" \
          --ks-key-alias "$ALIAS" \
          --ks-pass "pass:$KEY_STORE_PASSWORD" \
          --key-pass "pass:$KEY_PASSWORD" \
          --out "$OUT" \
          "$RUNNER_TEMP/aligned.apk"
        "$BT/apksigner" verify --verbose "$OUT" | head -6

        echo "signedReleaseFile=$OUT" >> "$GITHUB_OUTPUT"

    # 5. 将签名后的 APK 重命名为 v年月日.apk
    - name: Rename APK
      run: |
        mv ${{ steps.sign_app.outputs.signedReleaseFile }} app/build/outputs/apk/release/$VERSION.apk
        echo "重命名完成，当前文件列表:"
        ls -la app/build/outputs/apk/release/

    # 6. 创建 GitHub Release 并上传已签名的 APK
    - name: Create GitHub Release and Upload Assets
      if: github.event_name == 'push'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ env.VERSION }}
        name: ${{ env.VERSION }}
        generate_release_notes: true
        files: |
          app/build/outputs/apk/release/${{ env.VERSION }}.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
